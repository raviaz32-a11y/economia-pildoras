<style>
:root{--ink:#172033;--muted:#667085;--paper:#f6f8fc;--brand:#3157d5;--accent:#e9efff;--ok:#16794b;--line:#dce3ef;--warn:#fff5d8}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);color:var(--ink)}
button,input{font:inherit}.hero{background:linear-gradient(135deg,#253f9d,#6a43d6);color:#fff;padding:34px 20px}.hero>div,.wrap{max-width:1100px;margin:auto}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;opacity:.8}.hero h1{font-size:clamp(2rem,5vw,3.6rem);margin:.25rem 0}.hero p{max-width:760px;line-height:1.55}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.search{flex:1;min-width:230px;border:0;border-radius:12px;padding:13px 15px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:750;cursor:pointer;background:#fff;color:#24356d}.btn.primary{background:var(--brand);color:white}.wrap{padding:25px 18px 60px}
.progressbox{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:20px}.bar{height:10px;background:#edf0f5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.topic{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;cursor:pointer;box-shadow:0 3px 15px #1720330a}.topic h3{margin:4px 0 8px}.topic small{color:var(--muted)}
.hidden{display:none!important}.back{margin-bottom:15px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.cardhead{padding:16px 17px;background:var(--accent);font-weight:800}.cardbody{padding:16px 17px}.definition{line-height:1.55}.detail{display:none;border-top:1px solid var(--line);padding-top:12px;margin-top:12px;color:#39445c}.detail.open{display:block}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.mini{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 10px;cursor:pointer}.mastered{background:#e9f8f0;border-color:#b9e7cd;color:var(--ok)}
.visual{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin:18px 0}.visual h3{margin-top:0}.graph{width:100%;height:auto;max-height:350px}.sliderrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sliderrow input{flex:1;min-width:180px}
.compare{overflow:auto}.compare table{width:100%;border-collapse:collapse}.compare th,.compare td{padding:11px;border-bottom:1px solid var(--line);text-align:left}.compare th{background:#f3f6ff}
.confuse{background:var(--warn);border:1px solid #f1d788;border-radius:14px;padding:14px;margin:14px 0}.quiz{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:20px}.option{display:block;width:100%;text-align:left;margin:8px 0;padding:11px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}.option.good{border-color:#54a77b;background:#edf9f2}.option.bad{border-color:#dc7777;background:#fff0f0}
footer{text-align:center;color:var(--muted);padding:30px}@media(max-width:600px){.hero{padding-top:25px}.cards{grid-template-columns:1fr}}

.exam-intro,.exam-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}
.criterion{display:inline-block;background:#eef2ff;color:#3048a2;border-radius:999px;padding:6px 10px;font-size:.8rem;font-weight:800}
.rubric{background:#f7f9fc;border-left:4px solid #3157d5;padding:12px 14px;border-radius:8px;margin-top:12px}
.rubric ul{margin:.45rem 0 .1rem 1.2rem;padding:0}.model{line-height:1.6}

.exam-settings{background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.exam-settings label{font-weight:800}.exam-settings select{margin-left:8px;padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff}.exam-note{color:#667085;font-size:.92rem}.exam-meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.exam-count{font-weight:800;color:#3157d5}
</style></head>
<body><header class="hero"><div><div class="eyebrow">Píldoras educativas · v2</div><h1>Economía</h1><p>Estudia por conceptos, entiende los gráficos y comprueba lo aprendido con preguntas prácticas.</p><div class="toolbar"><input id="search" class="search" placeholder="Buscar concepto…"><button class="btn" onclick="randomReview()">🎲 Repaso aleatorio</button><button class="btn" onclick="exam()">📝 Modo examen</button></div></div></header>
<main class="wrap"><section id="home"><div class="progressbox"><b>Progreso general</b><div id="progressText" style="margin:7px 0;color:var(--muted)"></div><div class="bar"><i id="progressBar"></i></div></div><div id="topics" class="topics"></div></section><section id="lesson" class="hidden"></section><section id="exam" class="hidden"></section></main><footer>Tu progreso se guarda en este navegador.</footer>
<script>
const DATA={"1": {"name": "El problema económico", "cards": [{"term": "Economía", "def": "Ciencia social que estudia cómo administrar recursos escasos para satisfacer necesidades.", "example": "Elegir implica renunciar a alternativas porque los recursos son limitados."}, {"term": "Escasez", "def": "Situación en la que los recursos disponibles son insuficientes para satisfacer todas las necesidades.", "example": "El tiempo y el dinero obligan a priorizar."}, {"term": "Coste de oportunidad", "def": "Valor de la mejor alternativa a la que se renuncia cuando se toma una decisión.", "example": "Si dedicas una tarde a estudiar en lugar de trabajar, el coste de oportunidad puede ser el ingreso que habrías obtenido trabajando."}, {"term": "Recursos escasos", "def": "Medios limitados que se utilizan para producir bienes y servicios.", "example": "Trabajo, materias primas, capital y tiempo."}, {"term": "Necesidades", "def": "Sensaciones de carencia que las personas intentan satisfacer.", "example": "Alimentación, vivienda, educación u ocio."}, {"term": "Pirámide de Maslow", "def": "Modelo que ordena necesidades desde las más básicas hasta las de autorrealización.", "example": "Primero aparecen necesidades fisiológicas y de seguridad; después, sociales, estima y autorrealización."}, {"term": "Tipos de bienes", "def": "Los bienes pueden clasificarse según distintos criterios, como disponibilidad, función o relación con otros bienes.", "example": "Por ejemplo, bienes libres/económicos o de consumo/capital."}, {"term": "Microeconomía", "def": "Estudia las decisiones de consumidores, empresas y mercados concretos.", "example": "Analizar el precio de las entradas de cine es microeconomía."}, {"term": "Macroeconomía", "def": "Estudia la economía en su conjunto mediante magnitudes agregadas.", "example": "PIB, inflación o desempleo son cuestiones macroeconómicas."}, {"term": "Frontera de posibilidades de producción", "def": "Representa las combinaciones máximas de dos bienes que una economía puede producir usando eficientemente sus recursos y tecnología.", "example": "Un punto sobre la FPP es eficiente; uno interior refleja recursos desaprovechados; uno exterior es inalcanzable con los recursos actuales."}, {"term": "Agentes económicos", "def": "Participantes que toman decisiones económicas: familias, empresas y sector público.", "example": "Las familias consumen, las empresas producen y el sector público regula y presta servicios."}, {"term": "Factores de producción", "def": "Recursos utilizados para producir bienes y servicios.", "example": "Tierra, trabajo, capital e iniciativa empresarial."}]}, "2": {"name": "Oferta y demanda", "cards": [{"term": "Ley de oferta y demanda", "def": "Explica cómo la interacción entre compradores y vendedores contribuye a determinar el precio y la cantidad intercambiada.", "example": "El equilibrio aparece donde coinciden la cantidad demandada y la ofrecida."}, {"term": "Mercado", "def": "Ámbito físico o virtual en el que compradores y vendedores intercambian bienes y servicios.", "example": "Un mercado puede ser una tienda, una bolsa o una plataforma digital."}, {"term": "Consumidor", "def": "Agente que demanda bienes y servicios para satisfacer necesidades.", "example": "Una familia que compra alimentos actúa como consumidora."}, {"term": "Oferente", "def": "Agente que ofrece bienes o servicios en el mercado.", "example": "Una panadería que vende pan es oferente."}, {"term": "Curva de demanda", "def": "Representa la cantidad que los consumidores desean comprar a distintos precios, manteniendo constantes otros factores.", "example": "Normalmente, al subir el precio disminuye la cantidad demandada."}, {"term": "Curva de oferta", "def": "Representa la cantidad que los productores desean vender a distintos precios, manteniendo constantes otros factores.", "example": "Normalmente, un precio mayor incentiva una mayor cantidad ofrecida."}, {"term": "Precio", "def": "Cantidad de dinero que se entrega a cambio de un bien o servicio.", "example": "El precio actúa como señal para consumidores y productores."}, {"term": "Valor", "def": "Importancia o utilidad que se atribuye a un bien o servicio.", "example": "Valor y precio no tienen por qué coincidir."}, {"term": "Adam Smith", "def": "Economista y filósofo escocés del siglo XVIII asociado al análisis de los mercados y la división del trabajo.", "example": "Su obra más conocida es La riqueza de las naciones."}, {"term": "Mano invisible", "def": "Metáfora asociada a Adam Smith sobre cómo decisiones individuales pueden contribuir, bajo ciertas condiciones, a coordinar la actividad económica.", "example": "Los precios transmiten información y coordinan decisiones descentralizadas."}, {"term": "Desplazamientos de demanda", "def": "Cambios de toda la curva de demanda provocados por factores distintos del precio del propio bien.", "example": "Renta, gustos, expectativas o precios de bienes relacionados pueden desplazarla."}, {"term": "Desplazamientos de oferta", "def": "Cambios de toda la curva de oferta provocados por factores distintos del precio del propio bien.", "example": "Costes, tecnología, impuestos o número de productores pueden desplazarla."}, {"term": "Competencia", "def": "Rivalidad entre empresas por atraer compradores en un mercado.", "example": "Puede favorecer variedad, innovación y presión sobre precios."}, {"term": "Equilibrio de mercado", "def": "Situación en la que cantidad demandada y cantidad ofrecida coinciden.", "example": "En el gráfico aparece en la intersección de oferta y demanda."}]}, "3": {"name": "Tipos de mercado", "cards": [{"term": "Tipos de mercado", "def": "Los mercados pueden clasificarse según el número de empresas, diferenciación del producto y poder para fijar precios.", "example": "Competencia perfecta, competencia monopolística, oligopolio y monopolio."}, {"term": "Monopolio", "def": "Mercado en el que existe un único oferente de un bien o servicio sin sustitutos cercanos.", "example": "El oferente tiene una capacidad elevada para decidir el precio, condicionada por demanda y regulación."}, {"term": "Oligopolio", "def": "Mercado dominado por un número reducido de empresas cuyas decisiones son interdependientes.", "example": "Telefonía o determinadas industrias pueden presentar estructuras oligopolísticas."}, {"term": "Competencia perfecta", "def": "Modelo con muchas empresas, producto homogéneo, información y libertad de entrada y salida.", "example": "Las empresas son precio aceptantes."}, {"term": "Competencia monopolística", "def": "Mercado con muchas empresas que venden productos diferenciados.", "example": "Restaurantes o peluquerías son ejemplos habituales para estudiar esta estructura."}, {"term": "Precio aceptante", "def": "Agente que no puede influir individualmente en el precio de mercado y lo toma como dado.", "example": "Es una característica del modelo de competencia perfecta."}, {"term": "Precio decisor", "def": "Agente con capacidad para influir en el precio de su producto.", "example": "El poder es especialmente alto en un monopolio y puede existir en distintos grados en otros mercados."}, {"term": "Ejemplos de estructuras de mercado", "def": "Los ejemplos reales son aproximaciones: un mercado concreto puede no cumplir perfectamente todas las condiciones de un modelo.", "example": "Productos agrícolas estandarizados se usan como aproximación a competencia perfecta; restauración a competencia monopolística; algunos sectores concentrados a oligopolio."}]}, "4": {"name": "Sistemas económicos y distribución", "cards": [{"term": "Capitalismo", "def": "Sistema económico basado principalmente en propiedad privada y mercados.", "example": "Las decisiones de producción y consumo se coordinan en gran medida mediante mercados."}, {"term": "Comunismo", "def": "Sistema económico que propone la propiedad colectiva de los medios de producción y una amplia planificación económica.", "example": "Contrasta con la propiedad privada característica del capitalismo."}, {"term": "Economía mixta", "def": "Sistema que combina mecanismos de mercado con intervención del sector público.", "example": "Es el modelo habitual en muchas economías actuales."}, {"term": "Estado del Bienestar", "def": "Conjunto de actuaciones públicas orientadas a proteger el bienestar social.", "example": "Incluye servicios y prestaciones como sanidad, educación o pensiones."}, {"term": "Intervención económica", "def": "Actuaciones del Estado que influyen en la actividad económica.", "example": "Impuestos, gasto, regulación o provisión de servicios."}, {"term": "Libertad económica", "def": "Capacidad de tomar decisiones económicas dentro del marco legal.", "example": "Incluye decisiones de consumo, inversión o empresa."}, {"term": "Pobreza", "def": "Situación de insuficiencia de recursos para alcanzar determinadas condiciones de vida.", "example": "Puede medirse con distintos umbrales e indicadores."}, {"term": "Riqueza", "def": "Conjunto de activos y patrimonio acumulado.", "example": "No es lo mismo que la renta obtenida durante un periodo."}, {"term": "Igualdad", "def": "Principio de trato o distribución igual.", "example": "No siempre implica atender diferencias de partida."}, {"term": "Equidad", "def": "Principio que considera circunstancias y necesidades para buscar una distribución justa.", "example": "Igualdad y equidad no son conceptos idénticos."}, {"term": "Redistribución de la renta", "def": "Políticas que modifican la distribución inicial de ingresos.", "example": "Impuestos y transferencias son instrumentos habituales."}, {"term": "Desigualdad social", "def": "Diferencias en recursos, oportunidades o condiciones entre grupos o personas.", "example": "Puede estudiarse mediante indicadores económicos y sociales."}]}, "5": {"name": "Indicadores económicos", "cards": [{"term": "PIB", "def": "Valor monetario de los bienes y servicios finales producidos en un territorio durante un periodo.", "example": "Es una medida de producción, no una medida completa de bienestar."}, {"term": "Índice de Desarrollo Humano", "def": "Indicador compuesto que incorpora dimensiones de salud, educación e ingresos.", "example": "Permite complementar la información del PIB."}, {"term": "PIB per cápita", "def": "PIB dividido entre la población.", "example": "Es una media y no muestra cómo se distribuye la renta."}, {"term": "Renta nacional", "def": "Renta generada por los factores de producción de los residentes de una economía.", "example": "Se relaciona con la remuneración de trabajo y capital."}, {"term": "Renta personal disponible", "def": "Renta de la que disponen los hogares para consumir o ahorrar tras considerar impuestos y transferencias.", "example": "Ayuda a aproximar la capacidad económica de los hogares."}]}, "6": {"name": "Sector público y política fiscal", "cards": [{"term": "Impuestos directos", "def": "Gravan directamente la renta o el patrimonio.", "example": "El IRPF es un impuesto directo."}, {"term": "Impuestos indirectos", "def": "Gravan el consumo o determinadas operaciones.", "example": "El IVA es un impuesto indirecto."}, {"term": "Sistema impositivo progresivo", "def": "El tipo efectivo aumenta al aumentar la capacidad económica.", "example": "Busca que la carga relativa crezca con la base gravada."}, {"term": "Sistema impositivo regresivo", "def": "La carga relativa disminuye a medida que aumenta la capacidad económica.", "example": "Puede afectar proporcionalmente más a rentas bajas."}, {"term": "Sistema impositivo proporcional", "def": "Aplica un mismo tipo impositivo a la base.", "example": "El porcentaje permanece constante."}, {"term": "IVA", "def": "Impuesto indirecto sobre el consumo.", "example": "Se incorpora al precio de numerosos bienes y servicios."}, {"term": "IRPF", "def": "Impuesto directo sobre la renta de las personas físicas.", "example": "Su diseño incluye tramos y elementos personales."}, {"term": "Recaudación fiscal", "def": "Ingresos obtenidos por las administraciones mediante tributos.", "example": "Financia parte del gasto público."}, {"term": "Gastos del Estado", "def": "Recursos destinados por el sector público a bienes, servicios, inversiones y transferencias.", "example": "Educación, infraestructuras o prestaciones son ejemplos."}, {"term": "Política fiscal", "def": "Uso de ingresos y gastos públicos para influir en la economía.", "example": "Puede modificar impuestos o gasto público."}]}, "7": {"name": "Dinero y sistema financiero", "cards": [{"term": "Dinero", "def": "Medio de cambio, unidad de cuenta y depósito de valor.", "example": "Facilita intercambios sin recurrir al trueque."}, {"term": "Bancos", "def": "Intermediarios financieros que, entre otras funciones, captan depósitos y conceden financiación.", "example": "Conectan ahorro y crédito."}, {"term": "Sistema financiero", "def": "Conjunto de instituciones, mercados e instrumentos que canalizan fondos entre ahorradores y quienes necesitan financiación.", "example": "Incluye bancos y mercados financieros."}, {"term": "Sistema financiero internacional", "def": "Instituciones y mercados que canalizan financiación y pagos entre países.", "example": "Facilita operaciones económicas internacionales."}, {"term": "Tipos de interés", "def": "Precio del dinero prestado expresado normalmente como porcentaje.", "example": "Influyen en el coste de pedir prestado y en la remuneración del ahorro."}, {"term": "Préstamos bancarios", "def": "Operaciones en las que una entidad entrega fondos que deben devolverse con las condiciones pactadas.", "example": "Normalmente incluyen intereses y un plazo."}, {"term": "Productos financieros", "def": "Instrumentos para ahorrar, invertir, financiarse o gestionar riesgos.", "example": "Depósitos, préstamos, bonos o acciones son categorías distintas."}]}, "8": {"name": "Inflación y política monetaria", "cards": [{"term": "Inflación", "def": "Aumento generalizado y sostenido del nivel de precios.", "example": "Reduce el poder adquisitivo del dinero si los ingresos no aumentan al mismo ritmo."}, {"term": "Política monetaria", "def": "Decisiones sobre condiciones monetarias y financieras para influir en variables como inflación y actividad económica.", "example": "Los tipos de interés oficiales son uno de sus instrumentos."}]}, "9": {"name": "Unión Europea y derechos", "cards": [{"term": "Unión Europea", "def": "Unión política y económica de países europeos con instituciones y políticas compartidas.", "example": "Sus Estados miembros cooperan en múltiples ámbitos."}, {"term": "Declaración Universal de los Derechos Humanos", "def": "Declaración adoptada por la Asamblea General de las Naciones Unidas en 1948 que recoge derechos fundamentales.", "example": "No es una institución ni una política de la Unión Europea."}, {"term": "Políticas comunes", "def": "Ámbitos en los que los Estados de la UE coordinan o comparten políticas.", "example": "Agricultura, comercio o cohesión son ejemplos de ámbitos comunes."}]}, "10": {"name": "Comercio internacional", "cards": [{"term": "Comercio internacional", "def": "Intercambio de bienes y servicios entre países.", "example": "Permite exportar producción e importar bienes y servicios."}, {"term": "Aranceles", "def": "Impuestos aplicados a bienes importados.", "example": "Pueden encarecer el producto importado."}, {"term": "Cuotas arancelarias", "def": "Mecanismos que combinan un límite cuantitativo con un tratamiento arancelario determinado.", "example": "Las condiciones cambian al superar el volumen establecido."}, {"term": "Importación", "def": "Compra de bienes o servicios procedentes del exterior.", "example": "Para España, comprar un producto producido fuera es una importación."}, {"term": "Exportación", "def": "Venta de bienes o servicios al exterior.", "example": "Para España, vender producción española a otro país es una exportación."}, {"term": "Escalera de integración económica", "def": "Representa grados crecientes de integración entre economías.", "example": "Puede avanzar desde acuerdos comerciales hacia formas más profundas de integración."}]}, "11": {"name": "Economía y medio ambiente", "cards": [{"term": "Economía medioambiental", "def": "Estudia la relación entre actividad económica, recursos naturales y medio ambiente.", "example": "Analiza problemas como externalidades y uso de recursos."}, {"term": "Contaminación", "def": "Introducción de sustancias o efectos perjudiciales en el medio ambiente.", "example": "Puede generar costes que no recaen solo sobre quien contamina."}, {"term": "Deforestación", "def": "Pérdida o eliminación de superficies forestales.", "example": "Puede afectar biodiversidad, suelos y clima."}, {"term": "Crisis energética", "def": "Situación de fuerte tensión en disponibilidad, suministro o coste de la energía.", "example": "Puede afectar hogares, empresas y precios."}, {"term": "Falta de recursos", "def": "Limitación o agotamiento relativo de recursos necesarios para la actividad humana.", "example": "Conecta con el problema económico de la escasez."}, {"term": "Malthus", "def": "Economista y demógrafo asociado a la idea de tensiones entre crecimiento de la población y recursos.", "example": "Sus planteamientos forman parte de la historia del pensamiento económico."}, {"term": "David Ricardo", "def": "Economista clásico que desarrolló aportaciones sobre distribución y comercio internacional.", "example": "Es conocido, entre otras ideas, por la ventaja comparativa."}]}};
let mastered=new Set(JSON.parse(localStorage.getItem("ecoMastered")||"[]"));
const total=Object.values(DATA).reduce((n,t)=>n+t.cards.length,0);
function save(){localStorage.setItem("ecoMastered",JSON.stringify([...mastered]));renderHome()}
function key(t,i){return t+"-"+i}
function renderHome(){
 document.querySelector("#home").classList.remove("hidden");document.querySelector("#lesson").classList.add("hidden");document.querySelector("#exam").classList.add("hidden");
 const n=mastered.size;document.querySelector("#progressText").textContent=`${n} de ${total} conceptos dominados · ${Math.round(n/total*100)}%`;document.querySelector("#progressBar").style.width=(n/total*100)+"%";
 topics.innerHTML=Object.entries(DATA).map(([id,t])=>{let d=t.cards.filter((_,i)=>mastered.has(key(id,i))).length;return `<article class="topic" onclick="openTopic('${id}')"><small>TEMA ${id}</small><h3>${t.name}</h3><small>${d}/${t.cards.length} dominados</small><div class="bar" style="margin-top:10px"><i style="width:${d/t.cards.length*100}%"></i></div></article>`}).join("");
}
function visual(id){
 if(id==="1") return `<div class="visual"><h3>📈 FPP interactiva</h3><p>Mueve el control para cambiar la combinación producida. La curva representa combinaciones eficientes con los recursos actuales.</p><svg class="graph" viewBox="0 0 520 300"><line x1="55" y1="250" x2="480" y2="250" stroke="#667085"/><line x1="55" y1="250" x2="55" y2="30" stroke="#667085"/><path d="M70 45 Q280 70 455 235" fill="none" stroke="#3157d5" stroke-width="5"/><circle id="fppdot" cx="250" cy="102" r="8" fill="#172033"/><text x="440" y="280">Bien X</text><text x="10" y="35">Bien Y</text></svg><div class="sliderrow"><b>Combinación:</b><input type="range" min="0" max="100" value="45" oninput="moveFPP(this.value)"><span id="fppval">45</span></div></div>`;
 if(id==="2") return `<div class="visual"><h3>⚖️ Oferta y demanda</h3><p>Desplaza la demanda y observa cómo cambia el punto de equilibrio en este modelo simplificado.</p><svg class="graph" viewBox="0 0 520 300"><line x1="55" y1="250" x2="480" y2="250" stroke="#667085"/><line x1="55" y1="250" x2="55" y2="30" stroke="#667085"/><line x1="90" y1="230" x2="440" y2="55" stroke="#3157d5" stroke-width="5"/><line id="demand" x1="90" y1="55" x2="440" y2="230" stroke="#9a3f8c" stroke-width="5"/><circle id="eqdot" cx="265" cy="142" r="8" fill="#172033"/><text x="430" y="48">Oferta</text><text id="dlabel" x="425" y="245">Demanda</text></svg><div class="sliderrow"><b>Demanda:</b><input type="range" min="-60" max="60" value="0" oninput="shiftDemand(this.value)"><span id="demtxt">sin desplazamiento</span></div><div class="confuse"><b>⚠️ No confundas:</b> un cambio del precio del propio bien produce un movimiento a lo largo de la curva; otros determinantes pueden desplazar toda la curva.</div></div>`;
 if(id==="3") return `<div class="visual compare"><h3>🏪 Comparador de mercados</h3><table><tr><th>Estructura</th><th>Empresas</th><th>Producto</th><th>Poder sobre precio</th></tr><tr><td>Competencia perfecta</td><td>Muchas</td><td>Homogéneo</td><td>Muy bajo</td></tr><tr><td>Competencia monopolística</td><td>Muchas</td><td>Diferenciado</td><td>Limitado</td></tr><tr><td>Oligopolio</td><td>Pocas</td><td>Variable</td><td>Considerable</td></tr><tr><td>Monopolio</td><td>Una</td><td>Sin sustitutos cercanos</td><td>Elevado</td></tr></table><div class="confuse"><b>💡 Clave:</b> los ejemplos reales son aproximaciones; los modelos describen características del mercado.</div></div>`;
 return "";
}
function openTopic(id){
 home.classList.add("hidden");examEl().classList.add("hidden");lesson.classList.remove("hidden");let t=DATA[id];
 lesson.innerHTML=`<button class="btn back" onclick="renderHome()">← Temas</button><div class="eyebrow">TEMA ${id}</div><h2>${t.name}</h2>${visual(id)}<div class="cards">${t.cards.map((c,i)=>`<article class="card"><div class="cardhead">${c.term}</div><div class="cardbody"><div class="definition">${c.def}</div><div id="d${id}-${i}" class="detail"><b>Idea + ejemplo</b><br>${c.example}</div><div class="actions"><button class="mini" onclick="document.querySelector('#d${id}-${i}').classList.toggle('open')">Ver idea + ejemplo</button><button class="mini ${mastered.has(key(id,i))?'mastered':''}" onclick="toggleMaster('${id}',${i},this)">${mastered.has(key(id,i))?'✓ Dominado':'Marcar dominado'}</button></div></div></article>`).join("")}</div>${quizHTML(id)}`;
}
function toggleMaster(id,i,b){let k=key(id,i);mastered.has(k)?mastered.delete(k):mastered.add(k);localStorage.setItem("ecoMastered",JSON.stringify([...mastered]));openTopic(id)}
function quizHTML(id){let t=DATA[id], qs=[...t.cards].sort(()=>Math.random()-.5).slice(0,Math.min(5,t.cards.length));return `<div class="quiz"><h3>🧠 Mini-test</h3><div id="qbox">${questionMarkup(id,qs[0],qs,0)}</div></div>`}
function questionMarkup(id,c,qs,n){let pool=DATA[id].cards.filter(x=>x.term!==c.term).sort(()=>Math.random()-.5).slice(0,2).map(x=>x.term).concat(c.term).sort(()=>Math.random()-.5);return `<p><b>Pregunta ${n+1}/${qs.length}:</b> ¿Qué concepto corresponde a esta definición?</p><p>${c.def}</p>${pool.map(x=>`<button class="option" onclick="answer(this,'${esc(c.term)}','${esc(x)}')">${x}</button>`).join("")}<small>Selecciona una respuesta.</small>`}
function esc(s){return s.replaceAll("'","&#39;")}
function answer(b,correct,chosen){b.parentElement.querySelectorAll(".option").forEach(x=>x.disabled=true);b.classList.add(correct===chosen?"good":"bad");if(correct!==chosen)b.insertAdjacentHTML("afterend",`<p>La respuesta correcta es <b>${correct}</b>.</p>`)}
function moveFPP(v){let x=70+3.7*v,y=45+.019*v*v;fppdot.setAttribute("cx",x);fppdot.setAttribute("cy",y);fppval.textContent=v}
function shiftDemand(v){v=+v;demand.setAttribute("x1",90+v);demand.setAttribute("x2",440+v);dlabel.setAttribute("x",425+v);let x=265+v/2, y=142-v/4;eqdot.setAttribute("cx",x);eqdot.setAttribute("cy",y);demtxt.textContent=v===0?"sin desplazamiento":v>0?"hacia la derecha":"hacia la izquierda"}
function randomReview(){let ids=Object.keys(DATA),id=ids[Math.floor(Math.random()*ids.length)];openTopic(id);setTimeout(()=>{let cs=document.querySelectorAll(".card");cs[Math.floor(Math.random()*cs.length)].scrollIntoView({behavior:"smooth"})},50)}
function examEl(){return document.getElementById("exam")}
const EXAM_BANK=[{"c": "1.2", "t": "1", "q": "Tienes 30 € y debes elegir entre comprar un libro de 30 € o dos entradas de cine por el mismo importe. Si eliges el libro, identifica el coste de oportunidad y explica por qué existe.", "concepts": ["escasez", "elección", "coste de oportunidad", "FPP"], "model": "El coste de oportunidad es la mejor alternativa sacrificada: en este caso, las dos entradas de cine. Existe porque los recursos son escasos y elegir una opción obliga a renunciar a otra."}, {"c": "1.2", "t": "1", "q": "Una estudiante dispone de dos horas libres: puede estudiar Economía o trabajar y ganar 20 €. Decide estudiar. ¿Cuál es su coste de oportunidad? Justifica la respuesta.", "concepts": ["escasez", "elección", "coste de oportunidad", "FPP"], "model": "El coste de oportunidad son los 20 € que habría obtenido trabajando, suponiendo que trabajar era la mejor alternativa descartada."}, {"c": "1.2", "t": "1", "q": "Una economía puede producir alimentos o maquinaria. Explica cómo muestra la FPP el coste de oportunidad cuando se aumenta la producción de maquinaria.", "concepts": ["escasez", "elección", "coste de oportunidad", "FPP"], "model": "Para producir más maquinaria deben reasignarse recursos y renunciar a cierta producción de alimentos. Esa producción sacrificada representa el coste de oportunidad."}, {"c": "1.2", "t": "1", "q": "Un ayuntamiento solo puede financiar este año una piscina pública o mejorar el transporte urbano. Relaciona la decisión con escasez, elección y coste de oportunidad.", "concepts": ["escasez", "elección", "coste de oportunidad", "FPP"], "model": "La limitación presupuestaria genera escasez relativa. Elegir obliga a priorizar; el coste de oportunidad es el valor de la mejor alternativa descartada."}, {"c": "1.2", "t": "1", "q": "Explica por qué incluso una decisión que no exige pagar dinero puede tener coste de oportunidad. Incluye un ejemplo.", "concepts": ["escasez", "elección", "coste de oportunidad", "FPP"], "model": "El coste de oportunidad no tiene que ser monetario: es el valor de la mejor alternativa sacrificada. Dedicar tiempo a una actividad impide emplearlo en otra."}, {"c": "1.2", "t": "1", "q": "Una economía está produciendo en un punto situado sobre su FPP. ¿Qué indica sobre el uso de recursos? ¿Qué sucede si quiere producir más de uno de los bienes?", "concepts": ["escasez", "elección", "coste de oportunidad", "FPP"], "model": "Un punto sobre la FPP representa un uso eficiente de los recursos. Para producir más de un bien, normalmente debe renunciar a parte del otro: aparece un coste de oportunidad."}, {"c": "1.2", "t": "1", "q": "Distingue un punto interior, uno sobre la frontera y uno exterior a la FPP.", "concepts": ["escasez", "elección", "coste de oportunidad", "FPP"], "model": "El interior refleja recursos desaprovechados o ineficiencia; sobre la frontera, eficiencia con los recursos y tecnología disponibles; el exterior es inalcanzable con esos recursos y tecnología."}, {"c": "1.2", "t": "1", "q": "Una mejora tecnológica permite producir más con los mismos recursos. Explica qué efecto tendría sobre la FPP y relaciónalo con la escasez.", "concepts": ["escasez", "elección", "coste de oportunidad", "FPP"], "model": "La capacidad productiva aumenta y la FPP puede desplazarse hacia fuera. La mejora no elimina la escasez: los recursos siguen siendo limitados y continúan existiendo elecciones."}, {"c": "1.2", "t": "1", "q": "Compara dos estrategias ante la escasez: aumentar los recursos disponibles y utilizarlos de forma más eficiente. Explica cómo puede contribuir cada una.", "concepts": ["escasez", "elección", "coste de oportunidad", "FPP"], "model": "Aumentar recursos amplía la capacidad productiva; mejorar la eficiencia permite obtener más con los recursos existentes. Ambas ayudan, pero no eliminan la necesidad de elegir."}, {"c": "1.2", "t": "1", "q": "Explica por qué la escasez económica no significa necesariamente pobreza.", "concepts": ["escasez", "elección", "coste de oportunidad", "FPP"], "model": "La escasez económica surge porque los recursos son limitados frente a las necesidades y deseos. Afecta a todas las sociedades, aunque tengan distintos niveles de renta o riqueza."}, {"c": "1.3", "t": "1", "q": "Una familia decide ahorrar parte de su renta en vez de gastarla. Explica qué decisión económica está tomando y qué alternativas está comparando.", "concepts": ["agentes económicos", "decisiones económicas", "necesidades"], "model": "Está asignando recursos limitados entre consumo presente y ahorro. La elección depende de necesidades, prioridades y expectativas y supone renunciar a parte del consumo actual."}, {"c": "1.3", "t": "1", "q": "Una empresa debe decidir si contrata a una persona más o compra una máquina. Identifica el agente económico y explica por qué su decisión tiene consecuencias para otros agentes.", "concepts": ["agentes económicos", "decisiones económicas", "necesidades"], "model": "La empresa es el agente que decide. Su elección puede afectar al empleo, a proveedores, a producción y a las rentas de las familias."}, {"c": "1.3", "t": "1", "q": "Clasifica familias, empresas y sector público como agentes económicos y explica una decisión característica de cada uno.", "concepts": ["agentes económicos", "decisiones económicas", "necesidades"], "model": "Las familias deciden consumo y ahorro; las empresas, producción e inversión; el sector público, entre otras cuestiones, gasto, impuestos y regulación."}, {"c": "1.3", "t": "1", "q": "Explica cómo una decisión individual de consumo puede influir en las decisiones de las empresas cuando muchas personas actúan de forma parecida.", "concepts": ["agentes económicos", "decisiones económicas", "necesidades"], "model": "Si cambia de forma agregada la demanda de un producto, las empresas pueden modificar producción, precios, inversión o contratación."}, {"c": "1.3", "t": "1", "q": "Una familia prioriza alimentación y vivienda antes que ocio. Relaciona la decisión con necesidades, recursos limitados y la pirámide de Maslow.", "concepts": ["agentes económicos", "decisiones económicas", "necesidades"], "model": "La familia asigna recursos escasos priorizando necesidades básicas. La pirámide de Maslow es un modelo que ordena necesidades desde las más básicas hacia otras de niveles superiores."}, {"c": "3.1", "t": "1", "q": "Explica cómo se relacionan familias y empresas mediante bienes, servicios y factores de producción.", "concepts": ["agentes económicos", "factores de producción", "bienestar"], "model": "Las familias demandan bienes y servicios y aportan factores productivos; las empresas demandan factores y producen bienes y servicios. Estas relaciones conectan decisiones de ambos agentes."}, {"c": "3.1", "t": "1", "q": "¿Qué papel desempeña el sector público junto a familias y empresas? Pon dos ejemplos de actuaciones.", "concepts": ["agentes económicos", "factores de producción", "bienestar"], "model": "El sector público participa regulando, recaudando, gastando y prestando servicios. Por ejemplo, puede financiar educación y establecer impuestos."}, {"c": "3.1", "t": "1", "q": "Relaciona tierra, trabajo, capital e iniciativa empresarial con la producción de bienes y servicios.", "concepts": ["agentes económicos", "factores de producción", "bienestar"], "model": "Son factores de producción: recursos que se combinan para producir. El trabajo aporta actividad humana, el capital medios producidos, la tierra recursos naturales y la iniciativa organiza y asume decisiones empresariales."}, {"c": "2.2", "t": "2", "q": "Aumenta la renta de los consumidores y el bien analizado es normal. Explica qué ocurre con la demanda y con el equilibrio si la oferta permanece constante.", "concepts": ["oferta", "demanda", "precio", "equilibrio", "desplazamientos"], "model": "La demanda se desplaza hacia la derecha. Con oferta constante, el modelo predice normalmente mayor precio y mayor cantidad de equilibrio."}, {"c": "2.2", "t": "2", "q": "Una nueva tecnología abarata la fabricación de un producto. Explica qué ocurre con la oferta y con el equilibrio.", "concepts": ["oferta", "demanda", "precio", "equilibrio", "desplazamientos"], "model": "La oferta se desplaza hacia la derecha. Con demanda constante, normalmente disminuye el precio de equilibrio y aumenta la cantidad intercambiada."}, {"c": "2.2", "t": "2", "q": "Sube el precio del propio bien y no cambia ningún otro factor. ¿Hay desplazamiento de la demanda o movimiento a lo largo de la curva? Justifica.", "concepts": ["oferta", "demanda", "precio", "equilibrio", "desplazamientos"], "model": "Hay un movimiento a lo largo de la curva de demanda, porque cambia el precio del propio bien y no un determinante externo de la demanda."}, {"c": "2.2", "t": "2", "q": "Distingue entre un aumento de la demanda y un aumento de la cantidad demandada.", "concepts": ["oferta", "demanda", "precio", "equilibrio", "desplazamientos"], "model": "Un aumento de demanda desplaza toda la curva por un factor distinto del precio propio; un aumento de cantidad demandada es un movimiento a lo largo de la misma curva debido a un cambio del precio propio."}, {"c": "2.2", "t": "2", "q": "Una subida del coste de la energía afecta a las empresas productoras. Identifica la curva afectada y razona el cambio esperado.", "concepts": ["oferta", "demanda", "precio", "equilibrio", "desplazamientos"], "model": "Aumentan los costes de producción, por lo que la oferta se desplaza hacia la izquierda. Con demanda constante, suele aumentar el precio y disminuir la cantidad de equilibrio."}, {"c": "2.2", "t": "2", "q": "Los consumidores esperan que el precio de un producto sea mucho mayor el próximo mes. Explica cómo esas expectativas podrían afectar a la demanda actual.", "concepts": ["oferta", "demanda", "precio", "equilibrio", "desplazamientos"], "model": "Las expectativas pueden desplazar la demanda actual. Si los consumidores adelantan compras, la demanda presente puede aumentar y desplazarse hacia la derecha."}, {"c": "2.2", "t": "2", "q": "Define equilibrio de mercado y explica qué representan el precio y la cantidad de equilibrio.", "concepts": ["oferta", "demanda", "precio", "equilibrio", "desplazamientos"], "model": "El equilibrio se produce donde coinciden cantidad demandada y ofrecida. El precio de equilibrio es el que iguala ambas cantidades y la cantidad de equilibrio es la intercambiada en ese punto."}, {"c": "2.2", "t": "2", "q": "Explica el papel del consumidor y del oferente en un mercado.", "concepts": ["oferta", "demanda", "precio", "equilibrio", "desplazamientos"], "model": "El consumidor demanda bienes y servicios para satisfacer necesidades; el oferente pone bienes o servicios a disposición del mercado. Su interacción contribuye a determinar precios y cantidades."}, {"c": "2.2", "t": "2", "q": "Explica por qué precio y valor no son necesariamente lo mismo y aporta un ejemplo.", "concepts": ["oferta", "demanda", "precio", "equilibrio", "desplazamientos"], "model": "El precio es la cantidad monetaria pagada; el valor es la importancia o utilidad atribuida. Una persona puede valorar mucho un objeto cuyo precio de mercado sea bajo."}, {"c": "2.2", "t": "2", "q": "Relaciona la idea de la 'mano invisible' de Adam Smith con la coordinación de decisiones descentralizadas en los mercados.", "concepts": ["oferta", "demanda", "precio", "equilibrio", "desplazamientos"], "model": "La metáfora describe cómo decisiones individuales pueden, bajo ciertas condiciones, coordinarse mediante señales como los precios sin una dirección central de cada intercambio."}, {"c": "2.2", "t": "2", "q": "Una campaña publicitaria hace que un producto guste más a los consumidores. ¿Qué cambia: demanda, oferta o cantidad demandada? Explica.", "concepts": ["oferta", "demanda", "precio", "equilibrio", "desplazamientos"], "model": "Cambian los gustos, un determinante de la demanda distinto del precio propio; por ello se desplaza la curva de demanda, normalmente hacia la derecha."}, {"c": "2.2", "t": "2", "q": "Entra un gran número de nuevos productores en un mercado. ¿Qué curva se ve afectada y en qué dirección?", "concepts": ["oferta", "demanda", "precio", "equilibrio", "desplazamientos"], "model": "Aumenta el número de oferentes, por lo que la oferta de mercado se desplaza hacia la derecha, manteniendo constantes los demás factores."}, {"c": "2.2", "t": "3", "q": "Compara competencia perfecta y monopolio según número de oferentes y capacidad para influir en el precio.", "concepts": ["tipos de mercado", "monopolio", "oligopolio", "competencia"], "model": "En competencia perfecta hay muchas empresas y cada una es precio aceptante. En monopolio existe un único oferente y su capacidad para influir en el precio es mucho mayor, condicionada por demanda y regulación."}, {"c": "2.2", "t": "3", "q": "Un mercado tiene pocas empresas y cada una vigila las decisiones de sus rivales. Identifica la estructura y justifica.", "concepts": ["tipos de mercado", "monopolio", "oligopolio", "competencia"], "model": "Es un oligopolio: existe un número reducido de empresas y sus decisiones son interdependientes."}, {"c": "2.2", "t": "3", "q": "Muchas cafeterías compiten diferenciándose por ubicación, marca y servicio. ¿Qué estructura aproxima mejor el caso?", "concepts": ["tipos de mercado", "monopolio", "oligopolio", "competencia"], "model": "Competencia monopolística, porque hay muchas empresas y productos o servicios diferenciados."}, {"c": "2.2", "t": "3", "q": "Explica qué significa que una empresa sea precio aceptante y con qué estructura de mercado se asocia.", "concepts": ["tipos de mercado", "monopolio", "oligopolio", "competencia"], "model": "Significa que individualmente no puede influir en el precio de mercado y lo toma como dado. Se asocia al modelo de competencia perfecta."}, {"c": "2.2", "t": "3", "q": "Ordena conceptualmente monopolio, oligopolio y competencia perfecta según el número de oferentes y explica las diferencias sin asumir que los ejemplos reales cumplen perfectamente los modelos.", "concepts": ["tipos de mercado", "monopolio", "oligopolio", "competencia"], "model": "Monopolio: uno; oligopolio: pocos; competencia perfecta: muchos. Son modelos y los mercados reales pueden aproximarse a ellos sin cumplir todas sus condiciones."}, {"c": "1.1", "t": "4", "q": "Compara capitalismo, comunismo y economía mixta como soluciones alternativas para organizar la actividad económica. Explica al menos dos diferencias y el papel del mercado y del Estado.", "concepts": ["capitalismo", "comunismo", "economía mixta", "intervención económica"], "model": "El capitalismo se apoya principalmente en la propiedad privada y en los mercados; el comunismo propone la propiedad colectiva de los medios de producción y una amplia planificación; la economía mixta combina mecanismos de mercado con intervención pública. La comparación debe relacionar estas diferencias con distintas formas de tomar decisiones económicas."}, {"c": "1.1", "t": "10", "q": "Dos países reducen barreras comerciales y avanzan hacia una mayor integración económica. Explica qué significa ese proceso y analiza dos posibles repercusiones económicas.", "concepts": ["comercio internacional", "integración económica", "importación", "exportación"], "model": "La integración económica supone aumentar la cooperación y reducir obstáculos entre economías. Puede facilitar intercambios, ampliar mercados y modificar la competencia, aunque los efectos pueden ser diferentes entre sectores."}, {"c": "3.1", "t": "6", "q": "Explica cómo los impuestos y el gasto público relacionan al sector público con familias y empresas. Añade un ejemplo de cómo una decisión fiscal puede repercutir en la economía.", "concepts": ["impuestos", "recaudación fiscal", "gasto del Estado", "política fiscal"], "model": "El sector público obtiene parte de sus ingresos mediante impuestos y utiliza recursos en gasto, servicios, inversión y transferencias. Modificar impuestos o gasto puede alterar la renta disponible, el consumo o la actividad económica."}, {"c": "4.1", "t": "7", "q": "Una persona necesita financiar una compra importante mediante un préstamo. Explica qué elementos del sistema financiero debería comprender antes de tomar la decisión y por qué el tipo de interés es relevante.", "concepts": ["sistema financiero", "préstamos", "tipos de interés", "financiación"], "model": "Debe comprender las condiciones del préstamo, el plazo, el coste y su capacidad de devolución. El tipo de interés influye en el coste del dinero prestado y es esencial para comparar alternativas de financiación."}, {"c": "4.1", "t": "7", "q": "Explica la función de los bancos dentro del sistema financiero y relaciona ahorro y financiación.", "concepts": ["bancos", "sistema financiero", "ahorro", "financiación"], "model": "Los bancos son intermediarios financieros: entre otras funciones, captan depósitos y conceden financiación. Así ayudan a canalizar fondos desde agentes con capacidad de ahorro hacia quienes necesitan financiación."}, {"c": "4.3", "t": "7", "q": "Una persona dispone de una cantidad ahorrada y otra necesita pedir dinero prestado. Relaciona ambas situaciones con el funcionamiento del sistema financiero y explica cómo los tipos de interés afectan a sus decisiones.", "concepts": ["ahorro", "préstamos", "tipos de interés", "productos financieros"], "model": "El sistema financiero canaliza fondos entre ahorradores y quienes necesitan financiación. Los tipos de interés influyen en la remuneración del ahorro y en el coste de los préstamos, por lo que afectan a decisiones financieras cotidianas."}, {"c": "5.2", "t": "8", "q": "Los precios aumentan de forma generalizada y sostenida mientras los ingresos de una familia permanecen constantes. Explica el reto económico y analiza una consecuencia para esa familia.", "concepts": ["inflación", "poder adquisitivo", "política monetaria"], "model": "La situación describe inflación. Si los ingresos no aumentan al mismo ritmo que los precios, disminuye el poder adquisitivo de la familia. La política monetaria se relaciona con la respuesta a la inflación."}, {"c": "5.2", "t": "11", "q": "Una región experimenta pérdida de superficie forestal y presión creciente sobre sus recursos naturales. Identifica el reto económico y medioambiental y explica dos consecuencias que deberían considerarse.", "concepts": ["deforestación", "falta de recursos", "economía medioambiental", "sostenibilidad"], "model": "La situación combina deforestación y presión sobre recursos. Deben considerarse efectos ambientales, como pérdida de biodiversidad o deterioro de suelos, y efectos económicos relacionados con la disponibilidad futura de recursos."}, {"c": "5.2", "t": "10", "q": "Un país eleva los aranceles sobre determinados productos importados. Explica qué es un arancel y analiza cómo puede afectar al comercio y al precio de los productos importados.", "concepts": ["aranceles", "importación", "comercio internacional"], "model": "Un arancel es un impuesto aplicado a bienes importados. Puede encarecer el producto importado y modificar los intercambios y las decisiones de compradores y productores."}, {"c": "6.1", "t": "11", "q": "Una ciudad quiere reducir la contaminación sin ignorar las necesidades económicas de familias y empresas. Propón una medida socioeconómica y justifica qué factores deberían valorarse para aplicarla.", "concepts": ["contaminación", "economía medioambiental", "necesidades", "recursos"], "model": "Una propuesta válida debe identificar una medida concreta y justificarla considerando efectos económicos, sociales y ambientales: a quién afecta, qué costes genera y qué mejora pretende conseguir."}, {"c": "6.1", "t": "6", "q": "Ante una caída de la actividad económica, plantea una posible actuación de política fiscal y explica mediante qué mecanismo podría influir en familias o empresas.", "concepts": ["política fiscal", "gasto público", "impuestos", "renta disponible"], "model": "Puede proponerse modificar el gasto público o los impuestos. La respuesta debe explicar el mecanismo: un cambio tributario puede modificar la renta disponible y el consumo; un cambio en el gasto puede afectar directamente a la actividad."}];
function exam(){home.classList.add("hidden");lesson.classList.add("hidden");let e=examEl();e.classList.remove("hidden");let maxTopic=parseInt(localStorage.getItem("ecoMaxTopic")||"2");let pool=EXAM_BANK.filter(x=>parseInt(x.t)<=maxTopic);let previous=JSON.parse(localStorage.getItem("ecoLastExam")||"[]");let fresh=pool.filter(x=>!previous.includes(x.q)).sort(()=>Math.random()-.5);let repeat=pool.filter(x=>previous.includes(x.q)).sort(()=>Math.random()-.5);let size=Math.min(10,pool.length);let qs=fresh.concat(repeat).slice(0,size);localStorage.setItem("ecoLastExam",JSON.stringify(qs.map(x=>x.q)));let opts=Object.entries(DATA).map(([id,t])=>`<option value="${id}" ${parseInt(id)===maxTopic?'selected':''}>Tema ${id} · ${t.name}</option>`).join("");e.innerHTML=`<button class="btn" onclick="renderHome()">← Salir</button><div class="exam-intro"><div class="eyebrow">MODO EXAMEN</div><h2>Examen por criterios de evaluación</h2><div class="exam-settings"><label for="maxTopic">He estudiado hasta:</label><select id="maxTopic" onchange="setMaxTopic(this.value)">${opts}</select><p class="exam-note">Solo entran contenidos de los temas 1 al ${maxTopic}. La web recordará esta selección para el próximo examen.</p></div><p><span class="exam-count">${size} preguntas</span> de aplicación, razonamiento, comparación y análisis. Intentamos evitar las preguntas del examen anterior.</p><button class="btn primary" onclick="exam()">Generar otro examen</button></div>${qs.map((q,i)=>`<article class="exam-card"><span class="criterion">Criterio ${q.c} · Tema ${q.t}</span><h3>${i+1}. ${q.q}</h3><details><summary><b>Ver solución orientativa y pauta de corrección</b></summary><div class="model"><p>${q.model}</p><div class="rubric"><b>Conceptos que deberían aparecer:</b><ul>${q.concepts.map(c=>`<li>${c}</li>`).join("")}</ul></div></div></details></article>`).join("")}`;}
function setMaxTopic(v){localStorage.setItem("ecoMaxTopic",v);localStorage.removeItem("ecoLastExam");exam();}

search.addEventListener("input",e=>{let q=e.target.value.trim().toLowerCase();if(!q){renderHome();return}home.classList.add("hidden");lesson.classList.remove("hidden");let hits=[];Object.entries(DATA).forEach(([id,t])=>t.cards.forEach((c,i)=>{if((c.term+" "+c.def).toLowerCase().includes(q))hits.push({id,i,c,t})}));lesson.innerHTML=`<button class="btn back" onclick="search.value='';renderHome()">← Inicio</button><h2>Resultados (${hits.length})</h2><div class="cards">${hits.map(x=>`<article class="card"><div class="cardhead">${x.c.term}</div><div class="cardbody">${x.c.def}<p><small>Tema ${x.id} · ${x.t.name}</small></p></div></article>`).join("")}</div>`});
renderHome();
</script></body></html>
