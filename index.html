<script>
const THEMES=[{"n": 1, "title": "Introducción a la economía", "icon": "📘", "cards": [{"title": "Economía", "text": "Ciencia social que estudia cómo administrar recursos escasos para satisfacer necesidades.", "key": "Elegir implica priorizar porque los recursos son limitados.", "example": "Una familia reparte su presupuesto entre alimentación, vivienda, transporte y ocio."}, {"title": "Escasez", "text": "Situación en la que los recursos disponibles no permiten satisfacer todos los deseos y necesidades.", "key": "La escasez obliga a elegir.", "example": "Con tiempo y dinero limitados no podemos hacer o comprar todo a la vez."}, {"title": "Recursos escasos", "text": "Medios limitados que pueden emplearse para producir bienes y servicios o satisfacer necesidades.", "key": "Tiempo, dinero, materias primas y trabajo son limitados.", "example": "Una empresa dispone de un número limitado de trabajadores y máquinas."}, {"title": "Necesidades", "text": "Sensaciones de carencia que las personas buscan satisfacer mediante bienes, servicios o actividades.", "key": "Las necesidades pueden tener distinta importancia y cambiar con las circunstancias.", "example": "Alimentarse, sentirse seguro o relacionarse con otras personas son necesidades."}, {"title": "Pirámide de Maslow", "text": "Modelo que organiza necesidades humanas en niveles, desde las más básicas hasta las vinculadas al desarrollo personal.", "key": "Suele distinguir necesidades fisiológicas, seguridad, afiliación, estima y autorrealización.", "example": "Alimentación y descanso aparecen en la base; reconocimiento y desarrollo personal, en niveles superiores."}, {"title": "Tipos de bienes", "text": "Los bienes pueden clasificarse con distintos criterios: libres o económicos, de consumo o de capital, públicos o privados, entre otros.", "key": "La clasificación depende del criterio que estemos utilizando.", "example": "Una máquina es un bien de capital; una camiseta comprada por una familia es un bien de consumo."}, {"title": "Microeconomía", "text": "Rama que estudia las decisiones de consumidores, empresas y mercados concretos.", "key": "Se centra en agentes y mercados individuales.", "example": "Analizar por qué cambia el precio de las entradas de cine es microeconomía."}, {"title": "Macroeconomía", "text": "Rama que estudia la economía en su conjunto mediante variables agregadas.", "key": "PIB, inflación o desempleo son cuestiones macroeconómicas.", "example": "Estudiar la inflación de un país pertenece a la macroeconomía."}, {"title": "Frontera de posibilidades de producción", "text": "Representa las combinaciones máximas de dos bienes que pueden producirse con los recursos y la tecnología disponibles.", "key": "Los puntos sobre la frontera son eficientes; los interiores muestran recursos infrautilizados y los exteriores no son alcanzables con los recursos actuales.", "example": "Si se destinan más recursos a producir alimentos, puede ser necesario renunciar a producir parte de otros bienes."}, {"title": "Agentes económicos", "text": "Participantes principales de la actividad económica: familias, empresas y sector público.", "key": "Interactúan mediante consumo, producción, trabajo, impuestos y gasto.", "example": "Las familias consumen y ofrecen trabajo; las empresas producen; el Estado recauda y presta servicios."}, {"title": "Factores de producción", "text": "Recursos utilizados para producir bienes y servicios: tradicionalmente tierra, trabajo y capital; también se considera la iniciativa empresarial.", "key": "Combinarlos permite obtener producción.", "example": "Un restaurante combina local y materias primas, trabajadores, equipamiento y organización empresarial."}]}, {"n": 2, "title": "Oferta y demanda", "icon": "📗", "cards": [{"title": "Ley de oferta y demanda", "text": "Describe cómo la interacción entre compradores y vendedores contribuye a determinar precios y cantidades en un mercado.", "key": "Cuando cambia la oferta o la demanda puede cambiar el equilibrio.", "example": "Si aumenta mucho la demanda y la oferta no cambia, aparece presión al alza sobre el precio."}, {"title": "Mercado", "text": "Ámbito físico o virtual en el que compradores y vendedores intercambian bienes, servicios o factores productivos.", "key": "Un mercado no necesita ser un lugar físico.", "example": "Una tienda, una plataforma digital o el mercado laboral son mercados."}, {"title": "Consumidor", "text": "Agente que demanda bienes y servicios para satisfacer necesidades.", "key": "Las decisiones de los consumidores forman parte de la demanda.", "example": "Una familia compara precios antes de comprar alimentos."}, {"title": "Oferente", "text": "Persona o empresa que ofrece bienes o servicios en el mercado.", "key": "Las decisiones de los oferentes forman la oferta.", "example": "Una panadería decide cuántas barras producir y vender cada día."}, {"title": "Curva de demanda", "text": "Representa la cantidad que los consumidores desean comprar a distintos precios, manteniendo constantes otros factores.", "key": "Normalmente tiene pendiente negativa: a mayor precio, menor cantidad demandada.", "example": "Si unas entradas bajan de precio, más personas pueden estar dispuestas a comprarlas."}, {"title": "Curva de oferta", "text": "Representa la cantidad que los productores desean vender a distintos precios, manteniendo constantes otros factores.", "key": "Normalmente tiene pendiente positiva: un precio mayor puede incentivar una mayor cantidad ofrecida.", "example": "Un precio más alto puede hacer rentable producir más unidades."}, {"title": "Precio", "text": "Cantidad de dinero que normalmente se entrega a cambio de un bien o servicio.", "key": "Actúa como señal para compradores y vendedores.", "example": "Una subida del precio puede reducir compras e incentivar producción."}, {"title": "Valor", "text": "Importancia o utilidad que una persona atribuye a un bien o servicio; no tiene por qué coincidir con su precio.", "key": "Precio y valor no son sinónimos.", "example": "Un objeto con gran valor sentimental puede tener un precio de mercado pequeño."}, {"title": "Adam Smith", "text": "Economista y filósofo escocés del siglo XVIII, figura fundamental de la economía clásica.", "key": "Analizó la división del trabajo, los mercados y la coordinación de intereses individuales.", "example": "Su obra La riqueza de las naciones se publicó en 1776."}, {"title": "Mano invisible", "text": "Metáfora asociada a Adam Smith para describir cómo determinadas decisiones individuales coordinadas mediante mercados pueden contribuir a resultados no buscados directamente.", "key": "No significa que los mercados funcionen siempre de manera perfecta.", "example": "Productores que buscan clientes responden a precios y preferencias sin que una autoridad decida cada intercambio."}, {"title": "Desplazamientos de la demanda", "text": "La demanda se desplaza cuando cambia un factor distinto del precio del propio bien, como renta, gustos, expectativas o precios de bienes relacionados.", "key": "Un cambio del precio del propio bien produce un movimiento sobre la curva; otros determinantes pueden desplazarla.", "example": "Una moda puede aumentar la demanda de un producto a cada precio."}, {"title": "Desplazamientos de la oferta", "text": "La oferta se desplaza por cambios en costes, tecnología, expectativas, número de productores u otros factores distintos del precio del propio bien.", "key": "Una mejora tecnológica puede desplazar la oferta hacia la derecha.", "example": "Si baja el coste de una materia prima, las empresas pueden ofrecer más a cada precio."}, {"title": "Competencia", "text": "Situación en la que varios oferentes o demandantes participan en un mercado y rivalizan por intercambios.", "key": "El grado de competencia depende de la estructura del mercado.", "example": "Varias cafeterías de una zona compiten por atraer clientes."}, {"title": "Equilibrio de mercado", "text": "Situación representada por la intersección de oferta y demanda, donde la cantidad ofrecida coincide con la cantidad demandada.", "key": "El precio de equilibrio coordina los planes de compradores y vendedores en el modelo.", "example": "Si el precio está por encima del equilibrio puede aparecer exceso de oferta."}]}, {"n": 3, "title": "Tipos de mercado", "icon": "📙", "cards": [{"title": "Tipos de mercado", "text": "Las estructuras de mercado se distinguen por factores como número de empresas, diferenciación del producto y barreras de entrada.", "key": "Competencia perfecta, competencia monopolística, oligopolio y monopolio son modelos habituales.", "example": "Un mercado con muchas empresas pequeñas funciona de forma distinta a otro dominado por una sola."}, {"title": "Monopolio", "text": "Estructura en la que un único oferente abastece un mercado definido y existen fuertes barreras de entrada.", "key": "El monopolista tiene capacidad para influir en el precio, aunque está limitado por la demanda.", "example": "Un servicio de red puede constituir un monopolio en un territorio cuando solo existe un proveedor."}, {"title": "Oligopolio", "text": "Mercado dominado por un número reducido de empresas cuyas decisiones son interdependientes.", "key": "Cada empresa debe considerar las posibles reacciones de sus competidores.", "example": "La fabricación de grandes aviones comerciales es un ejemplo de mercado muy concentrado."}, {"title": "Competencia perfecta", "text": "Modelo con muchas empresas, producto homogéneo y libertad de entrada y salida, en el que cada empresa individual no controla el precio de mercado.", "key": "La empresa es precio aceptante.", "example": "Un pequeño productor de un producto agrícola estandarizado suele tener poca capacidad para alterar el precio general."}, {"title": "Competencia monopolística", "text": "Mercado con muchas empresas que ofrecen productos diferenciados y compiten mediante precio, calidad, marca o localización.", "key": "La diferenciación proporciona cierto margen para fijar precios.", "example": "Restaurantes o peluquerías pueden ofrecer servicios parecidos pero diferenciados."}, {"title": "Precio aceptante", "text": "Agente que toma el precio de mercado como dado porque individualmente no puede modificarlo de forma apreciable.", "key": "Es característico del modelo de competencia perfecta.", "example": "Un pequeño productor en un mercado muy amplio vende al precio existente."}, {"title": "Precio decisor", "text": "Agente con cierto poder de mercado para decidir o influir en su precio teniendo en cuenta la respuesta de la demanda y la competencia.", "key": "No significa que pueda elegir cualquier precio sin consecuencias.", "example": "Una empresa con un producto muy diferenciado puede tener margen para fijar su precio."}]}, {"n": 4, "title": "Sistemas económicos y distribución", "icon": "📕", "cards": [{"title": "Capitalismo", "text": "Sistema basado principalmente en propiedad privada, mercados e iniciativa empresarial para organizar buena parte de la actividad económica.", "key": "Los precios y las decisiones descentralizadas tienen un papel central.", "example": "Una empresa privada decide invertir esperando obtener ingresos y beneficios."}, {"title": "Comunismo", "text": "En su formulación económica clásica, propone propiedad colectiva de los medios de producción y organización de la producción orientada a objetivos colectivos.", "key": "Las experiencias históricas han adoptado instituciones y grados de planificación diferentes.", "example": "En una economía de planificación central, autoridades públicas pueden fijar objetivos de producción."}, {"title": "Economía mixta", "text": "Sistema que combina mercados y propiedad privada con intervención y provisión pública.", "key": "Las economías actuales combinan mecanismos públicos y privados en distinto grado.", "example": "Empresas privadas producen bienes mientras el Estado financia determinados servicios públicos."}, {"title": "Estado del Bienestar", "text": "Conjunto de políticas e instituciones públicas destinadas a proporcionar protección social y determinados servicios.", "key": "Puede incluir sanidad, educación, pensiones y prestaciones, según el país.", "example": "Una prestación por desempleo forma parte de los mecanismos de protección social."}, {"title": "Intervención económica", "text": "Actuación del sector público mediante regulación, impuestos, gasto, provisión de servicios u otras políticas.", "key": "Puede perseguir estabilidad, provisión de bienes públicos, corrección de externalidades o redistribución.", "example": "El Estado puede subvencionar una actividad o establecer normas de seguridad."}, {"title": "Libertad económica", "text": "Grado en que personas y empresas pueden tomar decisiones sobre producción, consumo, inversión e intercambio dentro del marco legal.", "key": "Convive con normas, derechos y obligaciones.", "example": "Una persona puede elegir entre distintas empresas al contratar un servicio."}, {"title": "Pobreza", "text": "Situación de insuficiencia de recursos o condiciones para alcanzar un nivel de vida determinado; puede medirse de forma absoluta o relativa.", "key": "La definición y el indicador utilizado importan.", "example": "La pobreza relativa suele compararse con el nivel de ingresos habitual de una sociedad."}, {"title": "Riqueza", "text": "Valor del patrimonio o conjunto de activos de una persona, hogar o entidad, descontando normalmente las deudas al hablar de riqueza neta.", "key": "Riqueza no es lo mismo que renta.", "example": "Una vivienda y ahorros forman patrimonio; un salario mensual es renta."}, {"title": "Igualdad", "text": "Idea de semejanza en trato, derechos, recursos u otros resultados, dependiendo del ámbito analizado.", "key": "Hay que especificar qué dimensión de igualdad se estudia.", "example": "Dos personas pueden tener igualdad ante una norma aunque sus rentas sean distintas."}, {"title": "Equidad", "text": "Concepto relacionado con la justicia en la distribución o el trato, cuyo significado depende del criterio utilizado.", "key": "Igualdad y equidad no son necesariamente idénticas.", "example": "Una política puede dar apoyos distintos cuando existen necesidades distintas."}, {"title": "Redistribución de la renta", "text": "Modificación de la distribución inicial de ingresos mediante impuestos, transferencias y servicios públicos.", "key": "El sistema fiscal y el gasto público son instrumentos habituales.", "example": "Los impuestos pueden financiar prestaciones y servicios utilizados por los hogares."}, {"title": "Desigualdad social", "text": "Diferencias sistemáticas entre personas o grupos en recursos, oportunidades o condiciones sociales.", "key": "Puede analizarse en renta, riqueza, educación u otras dimensiones.", "example": "Comparar la distribución de ingresos entre hogares permite estudiar una dimensión de la desigualdad."}]}, {"n": 5, "title": "Indicadores económicos", "icon": "📊", "cards": [{"title": "PIB", "text": "Valor monetario de los bienes y servicios finales producidos dentro de un territorio durante un periodo determinado.", "key": "Mide producción, no directamente bienestar.", "example": "El PIB anual recoge el valor de la producción final generada durante ese año."}, {"title": "Índice de Desarrollo Humano", "text": "Indicador compuesto que combina dimensiones de salud, educación e ingreso para aproximar el desarrollo humano.", "key": "Amplía la mirada más allá de la producción económica.", "example": "Dos países con renta similar pueden diferir en esperanza de vida o educación."}, {"title": "PIB per cápita", "text": "PIB dividido entre la población.", "key": "Es una media y no muestra cómo se distribuye la renta.", "example": "Un PIB per cápita alto puede coexistir con desigualdad."}, {"title": "Renta nacional", "text": "Magnitud que recoge las rentas generadas o recibidas por los factores de producción de los residentes, según la definición contable utilizada.", "key": "Permite observar la actividad económica desde la perspectiva de las rentas.", "example": "Salarios y determinadas rentas de la propiedad forman parte del análisis de la renta."}, {"title": "Renta personal disponible", "text": "Renta de la que disponen los hogares para consumir o ahorrar después de considerar impuestos directos y transferencias recibidas.", "key": "Se aproxima a los recursos monetarios disponibles para consumo y ahorro.", "example": "Una prestación recibida aumenta la renta disponible; un impuesto directo la reduce."}]}, {"n": 6, "title": "Sector público y política fiscal", "icon": "🏛️", "cards": [{"title": "Impuestos directos", "text": "Gravan directamente manifestaciones de capacidad económica como la renta o el patrimonio.", "key": "Se aplican directamente sobre una base asociada a la persona o entidad.", "example": "El IRPF grava la renta de las personas físicas."}, {"title": "Impuestos indirectos", "text": "Gravan operaciones como el consumo de bienes y servicios.", "key": "Se vinculan habitualmente a transacciones.", "example": "El IVA es un impuesto indirecto."}, {"title": "Sistema progresivo", "text": "Sistema en el que el tipo impositivo medio aumenta a medida que aumenta la base o capacidad económica, según su diseño.", "key": "Progresividad se refiere a cómo cambia la carga relativa.", "example": "Un impuesto con tramos crecientes puede ser progresivo."}, {"title": "Sistema regresivo", "text": "Estructura en la que la carga fiscal representa una proporción menor de la capacidad económica conforme esta aumenta.", "key": "La regresividad se analiza en términos relativos.", "example": "Un tributo idéntico en euros para todos pesa proporcionalmente más sobre una renta baja."}, {"title": "Sistema proporcional", "text": "Aplica un mismo tipo impositivo a la base considerada.", "key": "La proporción permanece constante aunque cambie la base.", "example": "Con un tipo del 10 %, una base doble genera el doble de impuesto."}, {"title": "IVA", "text": "Impuesto sobre el valor añadido que grava el consumo y se aplica a entregas de bienes y prestaciones de servicios según las normas correspondientes.", "key": "Es un impuesto indirecto.", "example": "Al comprar un producto, el precio final puede incluir IVA."}, {"title": "IRPF", "text": "Impuesto sobre la Renta de las Personas Físicas en España.", "key": "Es un impuesto directo sobre la renta personal conforme a sus reglas y tramos.", "example": "Parte de las rentas del trabajo puede quedar sujeta a IRPF."}, {"title": "Recaudación fiscal", "text": "Ingresos obtenidos por las administraciones públicas mediante impuestos y otros tributos.", "key": "Financia, junto con otras fuentes, la actividad pública.", "example": "Los impuestos recaudados contribuyen a financiar servicios y transferencias."}, {"title": "Gastos del Estado", "text": "Desembolsos públicos destinados a bienes, servicios, inversión, transferencias y otras funciones.", "key": "El presupuesto refleja prioridades y compromisos públicos.", "example": "Construir infraestructuras o pagar determinadas prestaciones supone gasto público."}, {"title": "Política fiscal", "text": "Uso de ingresos y gastos públicos para alcanzar objetivos económicos y presupuestarios.", "key": "Cambios en impuestos o gasto pueden afectar a la demanda agregada y a las cuentas públicas.", "example": "Aumentar la inversión pública es una medida fiscal."}]}, {"n": 7, "title": "Dinero y sistema financiero", "icon": "💶", "cards": [{"title": "Dinero", "text": "Activo generalmente aceptado como medio de pago y que cumple funciones como unidad de cuenta y depósito de valor.", "key": "Facilita el intercambio frente al trueque.", "example": "Los euros permiten expresar precios y pagar compras."}, {"title": "Bancos", "text": "Entidades financieras que, entre otras funciones, captan depósitos, conceden financiación y prestan servicios de pago dentro de la regulación aplicable.", "key": "Intermedian entre ahorro y financiación.", "example": "Un banco puede recibir depósitos y conceder un préstamo."}, {"title": "Sistema financiero", "text": "Conjunto de instituciones, mercados e instrumentos que canalizan fondos entre ahorradores y quienes necesitan financiación.", "key": "Conecta ahorro e inversión.", "example": "Bancos y mercados de valores forman parte del sistema financiero."}, {"title": "Sistema financiero internacional", "text": "Red de instituciones, mercados y acuerdos mediante los que se realizan financiación y pagos entre países.", "key": "Facilita flujos internacionales de capital y divisas.", "example": "Una empresa puede obtener financiación en mercados internacionales."}, {"title": "Tipos de interés", "text": "Precio relativo del uso del dinero durante un periodo, expresado normalmente como porcentaje.", "key": "Afecta al coste de pedir prestado y a la remuneración del ahorro.", "example": "Un préstamo al 5 % tiene un coste financiero mayor que uno comparable al 3 %."}, {"title": "Préstamos bancarios", "text": "Operaciones en las que una entidad entrega fondos que deben devolverse según las condiciones pactadas, normalmente con intereses.", "key": "Conviene distinguir capital, interés, plazo, cuotas y posibles comisiones.", "example": "Una familia solicita financiación para comprar un coche y la devuelve en cuotas."}, {"title": "Productos financieros", "text": "Instrumentos y contratos relacionados con ahorro, inversión, financiación, pagos o cobertura de riesgos.", "key": "Rentabilidad, riesgo, liquidez y costes varían entre productos.", "example": "Una cuenta, un depósito, un bono o un fondo son productos diferentes."}]}, {"n": 8, "title": "Inflación y política monetaria", "icon": "📈", "cards": [{"title": "Inflación", "text": "Aumento generalizado y sostenido del nivel de precios de bienes y servicios de una economía.", "key": "Reduce el poder adquisitivo del dinero si los ingresos no aumentan al mismo ritmo.", "example": "Si una cesta que costaba 100 pasa a costar 103, su precio ha aumentado un 3 %."}, {"title": "Política monetaria", "text": "Decisiones de la autoridad monetaria sobre las condiciones monetarias y financieras para perseguir sus objetivos, como la estabilidad de precios.", "key": "Los tipos de interés oficiales son uno de sus instrumentos.", "example": "Una subida de tipos puede encarecer el crédito y moderar la demanda."}]}, {"n": 9, "title": "Unión Europea y políticas comunes", "icon": "🇪🇺", "cards": [{"title": "Unión Europea", "text": "Unión política y económica de Estados europeos basada en tratados e instituciones comunes.", "key": "Sus miembros comparten competencias en determinadas materias y cooperan en otras.", "example": "El mercado único facilita la circulación de bienes, servicios, personas y capitales dentro de su marco jurídico."}, {"title": "Declaración Universal de los Derechos Humanos", "text": "Texto adoptado por la Asamblea General de las Naciones Unidas en 1948 que proclama derechos y libertades fundamentales.", "key": "No es una institución de la UE; es un referente internacional de derechos humanos.", "example": "Incluye derechos civiles, políticos, económicos, sociales y culturales."}, {"title": "Políticas comunes", "text": "Ámbitos en los que los Estados de la UE coordinan o comparten políticas conforme a los tratados.", "key": "Su alcance depende de las competencias atribuidas a la Unión.", "example": "La política agrícola común es un ejemplo de política de la UE."}]}, {"n": 10, "title": "Comercio internacional", "icon": "🌍", "cards": [{"title": "Comercio internacional", "text": "Intercambio de bienes y servicios entre agentes situados en distintos países.", "key": "Permite especialización e intercambio, aunque sus efectos pueden distribuirse de forma desigual.", "example": "Una empresa española vende maquinaria a una empresa de otro país."}, {"title": "Aranceles", "text": "Impuestos aplicados a determinados bienes cuando cruzan una frontera aduanera, especialmente a importaciones.", "key": "Elevan el coste de entrada del producto gravado.", "example": "Un arancel del 10 % aumenta la carga aplicada a una importación según su base aduanera."}, {"title": "Cuotas arancelarias", "text": "Mecanismo que permite importar una cantidad determinada con un arancel y aplica otro tratamiento arancelario al superar ese volumen.", "key": "Combina un límite cuantitativo con distintos niveles de arancel.", "example": "Las primeras unidades pueden entrar con un arancel reducido y las siguientes con uno mayor."}, {"title": "Importación", "text": "Compra o entrada de bienes y servicios procedentes del exterior.", "key": "Desde la perspectiva del país comprador es una importación.", "example": "Comprar café producido en otro país constituye una importación."}, {"title": "Exportación", "text": "Venta o salida de bienes y servicios hacia compradores del exterior.", "key": "Desde la perspectiva del país vendedor es una exportación.", "example": "Vender aceite producido en España a clientes de otro país es exportar."}, {"title": "Escalera de la integración económica", "text": "Forma didáctica de ordenar niveles crecientes de integración entre economías.", "key": "Suele avanzar desde acuerdos comerciales hacia formas con mayor coordinación, aunque las clasificaciones pueden variar.", "example": "Una unión aduanera añade un arancel exterior común a la eliminación de barreras internas entre sus miembros."}]}, {"n": 11, "title": "Economía y medio ambiente", "icon": "🌱", "cards": [{"title": "Economía medioambiental", "text": "Rama que estudia la relación entre actividad económica y medio ambiente, incluidos recursos naturales y externalidades.", "key": "Analiza incentivos y políticas frente a problemas ambientales.", "example": "El coste social de la contaminación puede ser mayor que el coste privado para quien contamina."}, {"title": "Contaminación", "text": "Introducción de sustancias o efectos que deterioran el medio ambiente y pueden generar costes sobre terceros.", "key": "Es un ejemplo habitual de externalidad negativa.", "example": "Las emisiones de una fábrica pueden afectar a personas que no participan en la transacción."}, {"title": "Deforestación", "text": "Pérdida o eliminación de superficie forestal por cambios de uso u otras causas.", "key": "Puede afectar biodiversidad, suelos, agua y almacenamiento de carbono.", "example": "Transformar bosque en terreno para otros usos reduce la cubierta forestal."}, {"title": "Crisis energética", "text": "Situación de fuerte tensión o insuficiencia en el suministro energético, normalmente acompañada de efectos importantes sobre precios y actividad.", "key": "La energía es un insumo esencial para hogares y empresas.", "example": "Una interrupción grave del suministro puede elevar los costes de producción."}, {"title": "Falta de recursos", "text": "Problema derivado de la disponibilidad limitada, distribución o agotamiento de determinados recursos frente a las necesidades.", "key": "Conecta escasez económica y sostenibilidad.", "example": "Una sequía prolongada puede intensificar la escasez de agua disponible."}, {"title": "Malthus", "text": "Thomas Robert Malthus fue un economista y demógrafo británico que analizó la relación entre crecimiento de la población y medios de subsistencia.", "key": "Sus planteamientos históricos generaron un amplio debate posterior.", "example": "Malthus sostuvo que el crecimiento poblacional podía presionar los recursos alimentarios."}, {"title": "David Ricardo", "text": "Economista clásico británico conocido, entre otras aportaciones, por sus trabajos sobre distribución, renta y ventaja comparativa.", "key": "La ventaja comparativa ayuda a explicar beneficios potenciales de la especialización y el comercio.", "example": "Dos países pueden beneficiarse del intercambio incluso si uno es más productivo en todos los bienes, cuando sus costes relativos difieren."}]}];
let current=1; const done=new Set(JSON.parse(localStorage.getItem("ecoDone")||"[]")); const total=THEMES.reduce((n,t)=>n+t.cards.length,0); const $=s=>document.querySelector(s);
function k(t,i){return t+"-"+i} function save(){localStorage.setItem("ecoDone",JSON.stringify([...done]));stats()}
function stats(){$("#themeStat").textContent=THEMES.length+" temas";$("#conceptStat").textContent=total+" conceptos";$("#doneStat").textContent=done.size+" dominados";document.querySelectorAll(".progress span").forEach(el=>{let t=+el.dataset.t,th=THEMES[t-1],n=th.cards.filter((_,i)=>done.has(k(t,i))).length;el.style.width=(100*n/th.cards.length)+"%"})}
function home(){ $("#home").classList.add("active");$("#topic").classList.remove("active");$("#themeGrid").innerHTML=THEMES.map(t=>`<article class="theme" onclick="openTheme(${t.n})"><div class="theme-icon">${t.icon}</div><small>TEMA ${t.n} · ${t.cards.length} CONCEPTOS</small><h3>${t.title}</h3><p>${t.cards.slice(0,4).map(c=>c.title).join(" · ")}${t.cards.length>4?"…":""}</p><div class="progress"><span data-t="${t.n}"></span></div></article>`).join("");stats()}
function card(c,t,i,search=false){let d=done.has(k(t,i));return `<article class="card"><div class="card-top"><span class="num">${i+1}</span><h3>${c.title}</h3></div><div class="card-body"><p class="definition">${c.text}</p><div class="reveal" id="r-${t}-${i}"><div class="box"><strong>💡 Idea clave</strong><br>${c.key}</div><div class="box example"><strong>🧩 Ejemplo</strong><br>${c.example}</div></div><div class="card-actions"><button class="tiny" onclick="reveal(${t},${i},this)">Ver idea + ejemplo</button><button class="tiny ${d?"done":""}" onclick="mark(${t},${i},this)">${d?"✓ Dominado":"Marcar dominado"}</button>${search?`<button class="tiny" onclick="openTheme(${t})">Ir al tema</button>`:""}</div></div></article>`}
function openTheme(n){current=n;let t=THEMES[n-1];$("#home").classList.remove("active");$("#topic").classList.add("active");$("#topicHead").innerHTML=`<div class="topic-top"><div class="topic-bigicon">${t.icon}</div><div><div class="eyebrow" style="color:#52606d">Tema ${n} de ${THEMES.length}</div><h2>${t.title}</h2><p>${t.cards.length} conceptos · estudia a tu ritmo.</p></div></div>`;$("#cards").innerHTML=t.cards.map((c,i)=>card(c,n,i)).join("");quiz(t);$("#prevBtn").style.visibility=n===1?"hidden":"visible";$("#nextBtn").style.visibility=n===THEMES.length?"hidden":"visible";window.scrollTo({top:0,behavior:"smooth"})}
function reveal(t,i,b){let e=$(`#r-${t}-${i}`);e.classList.toggle("open");b.textContent=e.classList.contains("open")?"Ocultar":"Ver idea + ejemplo"}
function mark(t,i,b){let x=k(t,i);done.has(x)?done.delete(x):done.add(x);save();b.classList.toggle("done");b.textContent=done.has(x)?"✓ Dominado":"Marcar dominado"}
function quiz(t){let picks=t.cards.slice(0,Math.min(5,t.cards.length)),all=THEMES.flatMap(x=>x.cards);$("#quiz").innerHTML=`<h3>❓ Mini test</h3><p>Identifica el concepto correcto.</p>`+picks.map((c,i)=>{let ds=all.filter(x=>x.title!==c.title).slice(i*3,i*3+3).map(x=>x.title),opts=[c.title,...ds].sort(()=>Math.random()-.5);return `<div class="q" data-answer="${c.title}"><strong>${i+1}. ¿Qué concepto corresponde a esta definición?</strong><p>${c.text}</p><div class="options">${opts.map(o=>`<button class="option" onclick="answer(this)">${o}</button>`).join("")}</div><div class="feedback"></div></div>`}).join("")+`<p class="score">Aciertos: <span id="score">0</span> / ${picks.length}</p>`}
function answer(b){let q=b.closest(".q");if(q.dataset.done)return;q.dataset.done="1";let ok=b.textContent===q.dataset.answer;b.classList.add(ok?"correct":"wrong");[...q.querySelectorAll(".option")].forEach(x=>{if(x.textContent===q.dataset.answer)x.classList.add("correct");x.disabled=true});q.querySelector(".feedback").textContent=ok?"✓ Correcto":"Respuesta: "+q.dataset.answer;if(ok)$("#score").textContent=+$("#score").textContent+1}
$("#homeBtn").onclick=()=>{$("#search").value="";$("#searchResults").style.display="none";$("#themeGrid").style.display="grid";home();window.scrollTo({top:0,behavior:"smooth"})};$("#prevBtn").onclick=()=>openTheme(current-1);$("#nextBtn").onclick=()=>openTheme(current+1);
$("#randomBtn").onclick=()=>{let t=THEMES[Math.floor(Math.random()*THEMES.length)];openTheme(t.n);setTimeout(()=>{let cs=[...document.querySelectorAll("#cards .card")],c=cs[Math.floor(Math.random()*cs.length)];c.scrollIntoView({behavior:"smooth",block:"center"});c.querySelector(".tiny").click()},250)};
$("#search").addEventListener("input",e=>{let q=e.target.value.trim().toLowerCase();if(!q){$("#searchResults").style.display="none";$("#themeGrid").style.display="grid";return}$("#home").classList.add("active");$("#topic").classList.remove("active");$("#themeGrid").style.display="none";$("#searchResults").style.display="block";let hits=[];THEMES.forEach(t=>t.cards.forEach((c,i)=>{if((c.title+" "+c.text+" "+c.key+" "+c.example).toLowerCase().includes(q))hits.push([c,t.n,i])}));$("#searchCount").textContent=hits.length+" coincidencia"+(hits.length===1?"":"s")+" para “"+e.target.value+"”";$("#resultCards").innerHTML=hits.length?hits.map(x=>card(x[0],x[1],x[2],true)).join(""):`<div class="empty">No he encontrado ese concepto. Prueba con otra palabra.</div>`});
home();
</script></body></html>
